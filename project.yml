name: NeatWebApp

options:
  bundleIdPrefix: com.geraltgraham
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  NeatWebApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/NeatWebApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geraltgraham.NeatWebApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/NeatWebApp/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NeatWebAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/NeatWebAppTests
    dependencies:
      - target: NeatWebApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geraltgraham.NeatWebAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NeatWebApp.app/Contents/MacOS/NeatWebApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NeatWebApp:
    build:
      targets:
        NeatWebApp: all
        NeatWebAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NeatWebAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
